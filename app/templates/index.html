<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <title>WhatsApp Automation Center</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow">

    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            WhatsApp Automation Center v0.1.0
        </span>

    </div>

</nav>

<div class="container mt-4">

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card shadow h-100">

                <div class="card-header">
                    Bot Durumu
                </div>

                <div class="card-body text-center">

                    <h3 id="connected">
                        ...
                    </h3>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow h-100">

                <div class="card-header">
                    Profil
                </div>

                <div class="card-body">

                    <h5 id="name">-</h5>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow h-100">

                <div class="card-header">
                    Telefon
                </div>

                <div class="card-body">

                    <h5 id="number">-</h5>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow h-100">

                <div class="card-header">
                    Platform
                </div>

                <div class="card-body">

                    <h5 id="platform">-</h5>

                </div>

            </div>

        </div>

    </div>

    <div class="card shadow mt-4">

        <div class="card-header">
            Sistem Bilgisi
        </div>

        <div class="card-body">

            <table class="table table-striped mb-0">

                <tr>

                    <th width="220">
                        Son Güncelleme
                    </th>

                    <td id="updated">
                        -
                    </td>

                </tr>

                <tr>

                    <th>
                        API
                    </th>

                    <td>
                        /api/status
                    </td>

                </tr>

                <tr>

                    <th>
                        Versiyon
                    </th>

                    <td>
                        0.1.0
                    </td>

                </tr>

            </table>

        </div>

    </div>

</div>

<script>

async function loadStatus(){

    const response = await fetch("/api/status");

    const data = await response.json();

    document.getElementById("connected").innerHTML =
        data.connected
            ? '<span class="badge bg-success fs-6">🟢 Connected</span>'
            : '<span class="badge bg-danger fs-6">🔴 Disconnected</span>';

    document.getElementById("name").textContent =
        data.name ?? "-";

    document.getElementById("number").textContent =
        data.number ?? "-";

    document.getElementById("platform").textContent =
        data.platform ?? "-";

    document.getElementById("updated").textContent =
        new Date().toLocaleString("tr-TR");

}

loadStatus();

setInterval(loadStatus,5000);

</script>

</body>

</html>
